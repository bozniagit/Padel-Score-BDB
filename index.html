<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Padel Scorekeeper - Wear OS Watch App</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
  @import url('https://fonts.googleapis.com/css2?family=Teko:wght@500;700&family=Inter:wght@400;600;800;900&display=swap');
  
  :root {
    --team1-bg: linear-gradient(135deg, #0d3251 0%, #175d97 50%, #0d3251 100%);
    --team2-bg: linear-gradient(135deg, #4d0a1b 0%, #8f1731 50%, #4d0a1b 100%);
    --neon-yellow: #ccff00;
  }

  body {
    font-family: 'Inter', sans-serif;
    user-select: none;
    -webkit-user-select: none;
    touch-action: manipulation;
  }

  .font-teko {
    font-family: 'Teko', sans-serif;
  }

  /* Deep inward padding for round watch screen safe zones */
  .circular-safe-inset {
    padding-left: 20%;
    padding-right: 20%;
  }

  .watch-container {
    width: 100vw;
    height: 100vh;
    max-width: 480px;
    max-height: 480px;
    aspect-ratio: 1 / 1;
    border-radius: 50%;
    overflow: hidden;
    box-shadow: 0 0 35px rgba(0,0,0,0.8), inset 0 0 15px rgba(0,0,0,0.5);
    position: relative;
  }

  .glow-text {
    text-shadow: 0 0 12px rgba(204, 255, 0, 0.5);
  }

  .btn-tap-effect:active {
    transform: scale(0.96);
    filter: brightness(1.2);
  }
  </style>
</head>
<body class="bg-black text-white flex items-center justify-center min-h-screen m-0 p-0 overflow-hidden">

  <div class="watch-container flex flex-col justify-between relative bg-black border-4 border-gray-900">
    
    <!-- TOP HALF: TEAM 1 ZONE (Blue) -->
    <div id="team1-zone" onclick="scorePoint(1)" class="h-1/2 w-full flex flex-col justify-between pt-6 pb-2 circular-safe-inset bg-[radial-gradient(ellipse_at_top,_var(--tw-gradient-stops))] from-blue-700 via-sky-900 to-slate-950 cursor-pointer relative btn-tap-effect border-b border-gray-800/60">
      
      <!-- Live Clock Top Center -->
      <div class="absolute top-1.5 left-0 right-0 text-center">
        <span id="top-clock" class="text-lg font-black text-white tracking-widest drop-shadow">12:08</span>
      </div>

      <!-- Top Content Row: Player Names (Left) and Game Score (Right) -->
      <div class="flex items-center justify-between w-full my-auto">
        
        <!-- Left Column: Names TOP, Set scores BOTTOM -->
        <div class="flex flex-col text-left max-w-[55%]">
          <!-- Player 1 Name & Serve Indicator -->
          <div class="flex items-center gap-1.5">
            <span id="t1-p1" class="text-xl sm:text-2xl font-black tracking-tight text-white uppercase truncate leading-none">JACK</span>
            <span id="t1-p1-serve" class="px-1.5 py-0.5 bg-[var(--neon-yellow)] text-black text-[10px] font-black rounded-full leading-none glow-text">L</span>
          </div>
          <!-- Player 2 Name & Serve Indicator -->
          <div class="flex items-center gap-1.5">
            <span id="t1-p2" class="text-xl sm:text-2xl font-black tracking-tight text-white uppercase truncate leading-none">TOM</span>
            <span id="t1-p2-serve" class="hidden px-1.5 py-0.5 bg-[var(--neon-yellow)] text-black text-[10px] font-black rounded-full leading-none glow-text">R</span>
          </div>

          <!-- Team 1 Sets Overview Breakdown (Bigger numbers) -->
          <div class="flex items-center gap-3 text-2xl sm:text-3xl font-black mt-1">
            <span id="t1-set1" class="text-gray-300">6</span>
            <span id="t1-set2" class="text-slate-400">3</span>
            <span id="t1-set3" class="text-[var(--neon-yellow)] text-3xl sm:text-4xl font-black glow-text">4</span>
          </div>
        </div>

        <!-- Right Column: Massive Slanted Game Score Number -->
        <div class="flex items-center justify-end">
          <span id="t1-score" class="font-teko text-8xl italic font-bold leading-none text-white tracking-tighter">40</span>
        </div>
      </div>

    </div>

    <!-- CENTER DIVIDER CONTROL BAR -->
    <div class="z-20 w-full bg-black/90 backdrop-blur-md border-y border-yellow-500/30 py-1.5 px-3 flex items-center justify-between shadow-2xl relative">
      
      <!-- Left: Elongated Pill Undo Button -->
      <button onclick="event.stopPropagation(); undoLastPoint();" class="bg-gray-800 hover:bg-gray-700 active:bg-gray-600 text-white text-xs font-bold px-4 py-1.5 rounded-full flex items-center gap-1.5 btn-tap-effect border border-gray-700 shadow-md">
        <span class="text-sm">↩</span>
        <span>Undo</span>
      </button>

      <!-- Center Status & Active Scoring Rule Badge -->
      <div class="flex flex-col items-center justify-center leading-none px-1">
        <span id="active-rule-badge" class="bg-yellow-400/20 text-[var(--neon-yellow)] text-[8px] font-black px-1.5 py-0.5 rounded-full tracking-wider border border-yellow-400/40 uppercase mb-0.5">
          GOLDEN POINT
        </span>
        <div id="match-status-text" class="text-[9px] font-black text-yellow-400 tracking-wide uppercase">
          <span id="match-timer" class="font-mono text-gray-300">⏱ 1:10</span> <span id="context-status" class="text-[var(--neon-yellow)]">BREAK POINT</span>
        </div>
      </div>

      <!-- Right: Elongated Pill Menu Button -->
      <button onclick="event.stopPropagation(); toggleMenu(true);" class="bg-gray-800 hover:bg-gray-700 active:bg-gray-600 text-white text-xs font-bold px-4 py-1.5 rounded-full flex items-center gap-1.5 btn-tap-effect border border-gray-700 shadow-md">
        <span class="text-sm">⚙</span>
        <span>Menu</span>
      </button>
    </div>

    <!-- BOTTOM HALF: TEAM 2 ZONE (Red/Purple) -->
    <div id="team2-zone" onclick="scorePoint(2)" class="h-1/2 w-full flex flex-col justify-between pt-2 pb-6 circular-safe-inset bg-[radial-gradient(ellipse_at_bottom,_var(--tw-gradient-stops))] from-rose-800 via-rose-950 to-slate-950 cursor-pointer relative btn-tap-effect border-t border-gray-800/60">
      
      <!-- Bottom Content Row: Player Names (Left) and Game Score (Right) -->
      <div class="flex items-center justify-between w-full my-auto">
        
        <!-- Left Column: Names TOP, Set scores BOTTOM (matching Blue zone layout) -->
        <div class="flex flex-col text-left max-w-[55%]">
          <!-- Player 1 Name & Serve Indicator -->
          <div class="flex items-center gap-1.5">
            <span id="t2-p1" class="text-xl sm:text-2xl font-black tracking-tight text-rose-200 uppercase truncate leading-none">HARRY</span>
            <span id="t2-p1-serve" class="hidden px-1.5 py-0.5 bg-[var(--neon-yellow)] text-black text-[10px] font-black rounded-full leading-none glow-text">L</span>
          </div>
          <!-- Player 2 Name & Serve Indicator -->
          <div class="flex items-center gap-1.5">
            <span id="t2-p2" class="text-xl sm:text-2xl font-black tracking-tight text-rose-200 uppercase truncate leading-none">SAM</span>
            <span id="t2-p2-serve" class="hidden px-1.5 py-0.5 bg-[var(--neon-yellow)] text-black text-[10px] font-black rounded-full leading-none glow-text">R</span>
          </div>

          <!-- Team 2 Sets Overview Breakdown -->
          <div class="flex items-center gap-3 text-2xl sm:text-3xl font-black mt-1">
            <span id="t2-set1" class="text-slate-400">4</span>
            <span id="t2-set2" class="text-gray-300">6</span>
            <span id="t2-set3" class="text-[var(--neon-yellow)] text-3xl sm:text-4xl font-black glow-text">3</span>
          </div>
        </div>

        <!-- Right Column: Massive Slanted Game Score Number -->
        <div class="flex items-center justify-end">
          <span id="t2-score" class="font-teko text-8xl italic font-bold leading-none text-white tracking-tighter">AD</span>
        </div>
      </div>

    </div>

  </div>

  <div id="menu-modal" class="hidden fixed inset-0 z-50 bg-black/95 flex flex-col items-center justify-center p-6 text-center overflow-y-auto">
    <div class="w-full max-w-xs space-y-4 my-auto py-6">
      <h2 class="text-lg font-black text-yellow-400 tracking-wider">MATCH SETTINGS</h2>
      
      <!-- Scoring Rule Selector -->
      <div class="bg-gray-900 p-3 rounded-xl border border-gray-800 text-left">
        <label class="text-xs text-gray-400 font-semibold block mb-1.5">SCORING RULE</label>
        <select id="rule-selector" onchange="updateScoringRule(this.value)" class="w-full bg-gray-800 text-white text-xs font-bold p-2.5 rounded-lg border border-gray-700 outline-none">
          <option value="GOLDEN POINT">Golden Point (No Advantage)</option>
          <option value="SILVER POINT">Silver Point (1 Advantage, then Deciding)</option>
          <option value="STAR POINT">Star Point (Tie-break Rule)</option>
          <option value="ADVANTAGE">Standard Advantage (Deuce / Ad)</option>
        </select>
      </div>

      <!-- Player Names Config -->
      <div class="bg-gray-900 p-3 rounded-xl border border-gray-800 text-left space-y-2">
        <label class="text-xs text-gray-400 font-semibold block">EDIT PLAYERS</label>
        <div class="grid grid-cols-2 gap-2">
          <input id="input-t1p1" type="text" placeholder="P1 Name" class="bg-gray-800 text-xs p-2 rounded text-white border border-gray-700 uppercase">
          <input id="input-t1p2" type="text" placeholder="P2 Name" class="bg-gray-800 text-xs p-2 rounded text-white border border-gray-700 uppercase">
          <input id="input-t2p1" type="text" placeholder="P3 Name" class="bg-gray-800 text-xs p-2 rounded text-white border border-gray-700 uppercase">
          <input id="input-t2p2" type="text" placeholder="P4 Name" class="bg-gray-800 text-xs p-2 rounded text-white border border-gray-700 uppercase">
        </div>
        <button onclick="savePlayerNames()" class="w-full bg-blue-600 hover:bg-blue-500 text-xs font-bold py-2 rounded text-white">Save Player Names</button>
      </div>

      <!-- Match Control Buttons -->
      <div class="flex gap-2">
        <button onclick="resetMatch()" class="w-1/2 bg-red-600/80 hover:bg-red-600 text-white text-xs font-bold py-2.5 rounded-xl border border-red-500">
          Reset Match
        </button>
        <button onclick="toggleMenu(false)" class="w-1/2 bg-yellow-400 text-black text-xs font-bold py-2.5 rounded-xl">
          Back to Match
        </button>
      </div>
    </div>
  </div>

<script>
  let matchState = {
    rule: 'GOLDEN POINT',
    team1: { name: 'Team 1', players: ['JACK', 'TOM'], gameScore: 3, setScores: [6, 3, 4] },
    team2: { name: 'Team 2', players: ['HARRY', 'SAM'], gameScore: 4, setScores: [4, 6, 3] },
    currentSet: 2,
    serverIndex: 1,
    history: []
  };

  const pointTerms = ['0', '15', '30', '40', 'AD'];

  function updateClock() {
    const now = new Date();
    const hours = String(now.getHours()).padStart(2, '0');
    const minutes = String(now.getMinutes()).padStart(2, '0');
    const clockEl = document.getElementById('top-clock');
    if (clockEl) clockEl.innerText = `${hours}:${minutes}`;
  }

  function updateScoringRule(newRule) {
    matchState.rule = newRule;
    document.getElementById('active-rule-badge').innerText = newRule;
    localStorage.setItem('padel_rule', newRule);
  }

  function savePlayerNames() {
    const t1p1 = (document.getElementById('input-t1p1').value.trim() || 'JACK').toUpperCase();
    const t1p2 = (document.getElementById('input-t1p2').value.trim() || 'TOM').toUpperCase();
    const t2p1 = (document.getElementById('input-t2p1').value.trim() || 'HARRY').toUpperCase();
    const t2p2 = (document.getElementById('input-t2p2').value.trim() || 'SAM').toUpperCase();

    matchState.team1.players = [t1p1, t1p2];
    matchState.team2.players = [t2p1, t2p2];

    localStorage.setItem('padel_t1_p1', t1p1);
    localStorage.setItem('padel_t1_p2', t1p2);
    localStorage.setItem('padel_t2_p1', t2p1);
    localStorage.setItem('padel_t2_p2', t2p2);

    renderUI();
    toggleMenu(false);
  }

  function resetMatch() {
    saveStateForUndo();
    matchState.team1.gameScore = 0;
    matchState.team1.setScores = [0, 0, 0];
    matchState.team2.gameScore = 0;
    matchState.team2.setScores = [0, 0, 0];
    matchState.currentSet = 0;
    renderUI();
    toggleMenu(false);
  }

  function scorePoint(teamNumber) {
    saveStateForUndo();
    if (window.navigator.vibrate) window.navigator.vibrate(40);
    
    let scoringTeam = teamNumber === 1 ? matchState.team1 : matchState.team2;
    let opponentTeam = teamNumber === 1 ? matchState.team2 : matchState.team1;

    if (scoringTeam.gameScore < 3) {
      scoringTeam.gameScore++;
    } else if (scoringTeam.gameScore === 3 && opponentTeam.gameScore < 3) {
      winGame(teamNumber);
      return;
    } else if (scoringTeam.gameScore === 3 && opponentTeam.gameScore === 3) {
      if (matchState.rule === 'GOLDEN POINT') {
        winGame(teamNumber);
        return;
      } else {
        scoringTeam.gameScore = 4; // AD
      }
    } else if (scoringTeam.gameScore === 4) {
      winGame(teamNumber);
      return;
    } else if (opponentTeam.gameScore === 4) {
      opponentTeam.gameScore = 3; // Deuce back
    }

    renderUI();
  }

  function winGame(teamNumber) {
    let winningTeam = teamNumber === 1 ? matchState.team1 : matchState.team2;
    winningTeam.setScores[matchState.currentSet]++;
    matchState.team1.gameScore = 0;
    matchState.team2.gameScore = 0;
    
    if (winningTeam.setScores[matchState.currentSet] >= 6) {
      if (matchState.currentSet < 2) matchState.currentSet++;
    }

    renderUI();
  }

  function saveStateForUndo() {
    matchState.history.push(JSON.parse(JSON.stringify(matchState)));
  }

  function undoLastPoint() {
    if (matchState.history.length > 0) {
      const prev = matchState.history.pop();
      matchState = prev;
      renderUI();
    }
  }

  function toggleMenu(show) {
    document.getElementById('menu-modal').classList.toggle('hidden', !show);
    if (show) {
      document.getElementById('input-t1p1').value = matchState.team1.players[0] || '';
      document.getElementById('input-t1p2').value = matchState.team1.players[1] || '';
      document.getElementById('input-t2p1').value = matchState.team2.players[0] || '';
      document.getElementById('input-t2p2').value = matchState.team2.players[1] || '';
      document.getElementById('rule-selector').value = matchState.rule;
    }
  }

  function renderUI() {
    document.getElementById('active-rule-badge').innerText = matchState.rule;
    
    document.getElementById('t1-p1').innerText = matchState.team1.players[0].toUpperCase();
    document.getElementById('t1-p2').innerText = matchState.team1.players[1].toUpperCase();
    document.getElementById('t2-p1').innerText = matchState.team2.players[0].toUpperCase();
    document.getElementById('t2-p2').innerText = matchState.team2.players[1].toUpperCase();

    // Game Scores
    document.getElementById('t1-score').innerText = pointTerms[matchState.team1.gameScore] || '0';
    document.getElementById('t2-score').innerText = pointTerms[matchState.team2.gameScore] || '0';

    // Set Scores
    document.getElementById('t1-set1').innerText = matchState.team1.setScores[0];
    document.getElementById('t1-set2').innerText = matchState.team1.setScores[1];
    document.getElementById('t1-set3').innerText = matchState.team1.setScores[2];

    document.getElementById('t2-set1').innerText = matchState.team2.setScores[0];
    document.getElementById('t2-set2').innerText = matchState.team2.setScores[1];
    document.getElementById('t2-set3').innerText = matchState.team2.setScores[2];
  }

  window.onload = function() {
    updateClock();
    setInterval(updateClock, 10000);

    matchState.team1.players[0] = (localStorage.getItem('padel_t1_p1') || 'JACK').toUpperCase();
    matchState.team1.players[1] = (localStorage.getItem('padel_t1_p2') || 'TOM').toUpperCase();
    matchState.team2.players[0] = (localStorage.getItem('padel_t2_p1') || 'HARRY').toUpperCase();
    matchState.team2.players[1] = (localStorage.getItem('padel_t2_p2') || 'SAM').toUpperCase();
    matchState.rule = localStorage.getItem('padel_rule') || 'GOLDEN POINT';
    renderUI();
  };
</script>
</body>
</html>
